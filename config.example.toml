# Copy to ~/.config/pgdesk/config.toml or use pgdesk --config PATH.
# References only: keep credentials in ~/.pg_service.conf + ~/.pgpass (chmod 600),
# or supply a libpq DSN through the named environment variable.
# A service may include host, port, user, sslmode=verify-full and sslrootcert.
# Never disable TLS for remote clusters merely to make a connection work.
version = 1
pool_size = 2
row_limit = 10000
statement_timeout_seconds = 120

[[clusters]]
name = "test-a"
service = "test-a"
# Optional list avoids discovery through the maintenance database:
# databases = ["domain1", "domain2"]

[[clusters]]
name = "prod-a"
service = "prod-a"
production = true

[[clusters]]
name = "test-b"
service = "test-b"

[[clusters]]
name = "prod-b"
service = "prod-b"
production = true

# Alternative to service (not both):
# [[clusters]]
# name = "local"
# dsn_env = "PGDESK_LOCAL_DSN"
# maintenance_database = "postgres"
