[project]
name = "pgdesk"
version = "0.1.0"
description = "Keyboard-first PostgreSQL workspaces with resilient pools and SQL assistance"
requires-python = ">=3.13"
dependencies = [
  "textual[syntax]>=8.0,<9",
  "rich>=14,<15",
  "psycopg[binary,pool]>=3.3,<4",
  "openai>=2,<3",
  "pglast>=7,<8",
  "python-dotenv>=1,<2",
]

[project.scripts]
pgdesk = "pgdesk.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
